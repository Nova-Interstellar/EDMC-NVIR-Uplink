name: Release

# Cutting a release is bumping PLUGIN_VERSION. Nothing else to remember, and
# nothing to forget in a different order.
#
# Every push to main is checked, but only a version that has no tag yet
# produces anything — the other pushes finish in a couple of seconds having
# decided there is nothing to do. That is deliberate: the alternative is a
# separate "please release now" step that gets skipped, and members find out a
# fix exists when someone mentions it in Discord.
#
# version.py reads PLUGIN_VERSION off main directly, so an update is announced
# in the plugin the moment the bump lands. This makes the download that
# announcement points at exist as well.

on:
  push:
    branches: [main]
  # For re-running a release whose upload failed, without an empty commit.
  workflow_dispatch:

# Only what creating a release needs.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the version the plugin reports
        id: plugin
        run: |
          version="$(sed -n 's/^PLUGIN_VERSION = "\(.*\)"$/\1/p' nvir/config.py)"
          if [ -z "$version" ]; then
            echo "::error file=nvir/config.py::PLUGIN_VERSION not found."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Plugin reports $version"

          # A release build is meant to ship with the debug tooling off. Not
          # fatal — it is a squadron plugin and a debug build still works — but
          # it ships a Dev Mode section to every member, so say so where
          # somebody will read it.
          if grep -q '^DEBUG = True' nvir/config.py; then
            echo "::warning file=nvir/config.py::DEBUG is True, so this release carries the debug tooling."
          fi

      - name: Has this version already been released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.plugin.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.plugin.outputs.tag }} is already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Flat: the archive root *is* the plugin folder's contents, with load.py
      # at the top and no wrapping directory.
      #
      # That is what makes extracting work without instructions. Windows
      # Explorer's "Extract All" defaults its destination to a folder named
      # after the archive, so extracting into EDMC's plugins folder produces
      # plugins\EDMC-NVIR-Uplink\load.py and EDMC finds it. An archive that
      # carried its own folder would land one level deeper than that, and
      # GitHub's own source zip is worse again — EDMC-NVIR-Uplink-main, which
      # is the commonest bad install there is.
      #
      # The asset filename therefore decides the plugin folder's name. Renaming
      # it — to add the version, say — renames the folder a member ends up
      # with, and EDMC stops finding the plugin. It is a filename with a job.
      - name: Build the plugin archive
        if: steps.check.outputs.exists == 'false'
        run: |
          set -eu
          staging="$(mktemp -d)"
          mkdir -p "$staging/nvir"

          cp load.py README.md "$staging/"
          cp nvir/*.py nvir/README.md "$staging/nvir/"

          # Developer tooling. A junction script pointed at somebody else's
          # checkout is no use to a member and invites a double-click.
          rm -f "$staging/nvir/link-to-edmc.bat"

          ( cd "$staging" && zip -qr "$GITHUB_WORKSPACE/EDMC-NVIR-Uplink.zip" load.py README.md nvir )
          unzip -l EDMC-NVIR-Uplink.zip

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.plugin.outputs.tag }}" \
            EDMC-NVIR-Uplink.zip \
            --title "NVIR Uplink ${{ steps.plugin.outputs.version }}" \
            --generate-notes \
            --notes "Extract \`EDMC-NVIR-Uplink.zip\` **into** EDMC's plugin folder — **File → Settings → Plugins → Open** — and let it create the \`EDMC-NVIR-Uplink\` folder for you. Then restart EDMC.

          Do not rename the archive before extracting: its name becomes the plugin folder's name, and EDMC looks for that one.

          Setup and troubleshooting: [README](https://github.com/${{ github.repository }}#readme)."
